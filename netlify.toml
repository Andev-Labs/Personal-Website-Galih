# Next.js runs on Netlify through the OpenNext adapter (plugin below).
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.9.0"

# OG images read fonts from assets/ at render time.
[functions]
  included_files = ["assets/**"]

# Sites linked through the API skip runtime auto-install, so pin the adapter here.
[[plugins]]
  package = "@netlify/plugin-nextjs"
